# Render Blueprint - CareAI Deployment
# https://render.com/docs/blueprint-spec

services:
  # ===================== Backend API (FastAPI) =====================
  - type: web
    name: careai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        sync: false   # You must set this manually in Render dashboard

  # ===================== Frontend (React Static Site) =====================
  - type: web
    name: careai-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: build
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: careai-backend
          property: hostport

