services:
  - type: web
    name: healthcare-backend
    env: docker
    plan: free
    branch: main
    dockerfilePath: Dockerfile.backend
    buildCommand: ""
    startCommand: "uvicorn server:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
